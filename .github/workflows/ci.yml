name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax-check lib files
        run: |
          node --check lib/analyzer.js
          node --check lib/profiles.js
          node --check lib/projection.js
          node --check lib/calibrate.js
          node --check lib/index.js
          node --check lib/client.js
          node --check scripts/patch-apiproxy.mjs
      - name: Run unit tests (zero-dependency)
        run: node --test test/analyzer.test.js test/projection.test.js test/calibrate.test.js test/golden-verify.test.js
